name: Check

on:
  pull_request:
    paths: ["extensions/**", "scripts/**", "tests/**", ".github/workflows/**"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Test the Store scripts
        run: node --test tests/*.test.mjs
      - name: Check changed extensions
        run: node scripts/check.mjs --base origin/${{ github.base_ref }}
