name: Check

# Runs on every pull request, not only ones that touch extensions: main
# requires this check, and a check that never starts would block the merge.
on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Test the Store scripts
        run: node --test tests/*.test.mjs
      - name: Check changed extensions
        run: node scripts/check.mjs --base origin/${{ github.base_ref }}
